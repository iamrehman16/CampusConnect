name: server-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# No path filter: this must run on every PR so it's always present when
# required by branch protection. A path-filtered required check that never
# triggers (e.g. a client-only PR) would leave the PR stuck pending forever.

defaults:
  run:
    working-directory: server

jobs:
  server-typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # tsc -p tsconfig.build.json — typecheck and emit in one step
      - run: npm run build

  # Non-blocking until the existing suite is fixed (9/10 suites currently fail
  # on DI setup, unrelated to this workflow). See BACKLOG.md cleanup PBI.
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test -- --ci

  # Required (BACKLOG.md A11, 2026-09-18) — server lint is clean.
  # Runs eslint directly (not `npm run lint`) because that script uses --fix,
  # which silently patches files instead of reporting them in CI.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx eslint "{src,apps,libs,test}/**/*.ts"
