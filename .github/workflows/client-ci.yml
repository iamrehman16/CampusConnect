name: client-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# No path filter: this must run on every PR so it's always present when
# required by branch protection. A path-filtered required check that never
# triggers (e.g. a server-only PR) would leave the PR stuck pending forever.

defaults:
  run:
    working-directory: client

jobs:
  client-typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # tsc -b (typecheck) && vite build, matching the local `npm run build` contract
      - run: npm run build

  # Clean as of BACKLOG.md A10 (2026-09-18) — required on main, see branch
  # protection (not this file; check via `gh api .../branches/main/protection`).
  lint:
    name: client-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
