name: Feature request
description: Suggest a new feature or an improvement to an existing one.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Search [existing issues](https://github.com/iamrehman16/CampusConnect/issues) first in case it has already been proposed.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, and for whom (student, contributor, admin, university)?
      placeholder: As a student preparing for exams, I can't ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should happen? Include UI sketches or API shapes if you have them.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have thought about.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Auth / onboarding
        - Library / resources
        - Ask AI / RAG
        - Messenger
        - Community
        - Mentorship / reputation
        - Notifications
        - Admin console
        - PWA / offline
        - Multi-tenancy / SaaS
        - Developer experience
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself.
